# KyokouAuth on Velocity / BungeeCord
#
# Settings are loaded at startup. The plugin adds missing settings from the current version without
# overwriting existing ones. `/kyokouauth reload` reloads messages only; restart the proxy for config changes.

database:
  # sqlite | h2 | mysql | mariadb | postgresql
  type: "sqlite"
  # File name inside `plugins/kyokouauth/` for SQLite, or database name for server dialects.
  database: "kyokouauth"
  host: "127.0.0.1"
  # 0 uses the default port for the selected database type.
  port: 0
  username: ""
  password: ""
  pool-size: 4
  # Repository for downloading missing JDBC drivers into `plugins/kyokouauth/libraries/`.
  driver-repository: "https://repo1.maven.org/maven2"
  auto-download-driver: true

session:
  # Hours a verified Microsoft role stays trusted before requiring sign-in again. 0 disables reuse.
  hours: 12
  # Require the same client IP for session reuse. Disable only when players share one NAT/tunnel IP.
  bind-address: true

bedrock:
  # Accept Bedrock logins verified by Floodgate 2.2.5 on this proxy (`auth-type: floodgate` on Geyser).
  # When `role-selection.enabled` is false, only unlinked Bedrock players are admitted under their
  # Floodgate prefix; linked accounts require `role-selection.enabled: true` and an official global link.
  enabled: false

role-selection:
  # Let linked Bedrock players choose between their server Microsoft role and linked Java role.
  # Each role keeps its own UUID, name, skin and player data. Independent of `bedrock.enabled`.
  enabled: false
  # Seconds allowed on the role menu before disconnecting (5..600). Closing the menu never selects a role.
  timeout-seconds: 60
  # Seconds a chosen role waits for one manual reconnect when switching UUID or name (5..120).
  hint-ttl-seconds: 30

migration:
  # Velocity / BungeeCord: claim a legacy AuthMe profile as a Java Microsoft role (U), not a premium or Bedrock role.
  # For normal migration, copy AuthMe/config.yml, the SQLite snapshot if applicable, and playerdata into migration/inbox/.
  # Run ka migration scan, review issues, then confirm. After confirmation, claims and restarts use only the local snapshot.
  # Confirm only after all writes have stopped and the account and player files come from the same backup. It does not stop the old server.
  # ka migration disable persists across restarts and stops new claims without undoing existing profile ownership.
  # The static settings below are only for explicit manual or direct-source operation; false does not override an active inbox snapshot.
  enabled: false
  authme:
    # Optional direct-source proof: /ka claim authme <old name> <old password> inside Limbo.
    # Requires migration.enabled; the player still completes both confirmations and a fresh Microsoft verification.
    enabled: false
    # Set true only when the source is frozen or you have a consistent offline snapshot. This setting will not freeze it for you.
    source-frozen: false
    # Defaults to authme when a source config is provided. Manual configuration needs a non-empty batch name.
    batch: ""
    # Direct-source mode: read plugins/AuthMe/config.yml under server-folder, or supply config-file explicitly.
    # Inbox scanning always uses migration/inbox/AuthMe/config.yml. Relative paths are based on this plugin's data directory.
    config-file: ""
    server-folder: ""
    # sqlite | mysql | mariadb. These manual source settings apply only when no AuthMe config is supplied.
    type: "sqlite"
    # Use an existing, consistent SQLite snapshot. Absolute paths are also accepted.
    # Symlinks and databases with -wal, -shm or -journal sidecars are rejected.
    sqlite-file: "migration/authme.db"
    # MySQL/MariaDB require a JDBC URL and a SELECT-only account. Database TLS does not encrypt Minecraft traffic.
    # MySQL example: jdbc:mysql://auth-db.example.org:3306/authme?sslMode=VERIFY_IDENTITY
    # MariaDB example: jdbc:mariadb://auth-db.example.org:3306/authme?sslMode=verify-full
    # connectTimeout and socketTimeout default to 5000 ms and must be between 1 and 10000 when set.
    # Do not put credentials in the URL. allowMultiQueries and autoReconnect can only be set to false.
    jdbc-url: ""
    # Database credentials for explicit direct-source mode, not a player's old password.
    # Inbox scanning reads credentials from the copied AuthMe config. Do not commit real credentials.
    username: ""
    password: ""
    # Only for manual source configuration. Use letters, digits and underscores for table and column names.
    table: "authme"
    name-column: "username"
    password-column: "password"
    totp-column: "totp"
    password-charset: "UTF-8"
    # Only the standard salted $SHA$ format is supported. Accounts using TOTP or other hashes cannot use password self-service.
    hash: "SHA256"
    # Private commands are kept out of normal chat and command completion. This does not encrypt offline-mode traffic
    # or hide passwords from client-side history, screenshots, or earlier packet loggers.

verification:
  # Move a player's Microsoft binding to a new free non-premium name after signing in with the same
  # Microsoft account. Their UUID stays the same and the old name is released.
  auto-rename: true
  # Seconds allowed to finish Microsoft device-code sign-in before disconnecting.
  timeout-seconds: 300
  # Minimum seconds between Microsoft token polls; longer intervals from Microsoft always take priority.
  poll-interval-seconds: 5
  # Command roots hidden and blocked until verification or role selection completes (no `/` or args).
  # List standalone aliases separately. `[]` clears command blocking; `["*"]` blocks all commands.
  # Unauthenticated players can never switch backend servers regardless of this list.
  blocked-commands:
    - server

safety:
  # Maximum connection attempts per IP per minute. 0 disables the limit.
  connections-per-minute: 10
  # Capacity caps for pending logins and background auth workers; overflow is rejected immediately.
  pending-login-limit: 4096
  io-workers: 4
  io-queue-capacity: 256

premium:
  # Maximum uncached Mojang name lookups within the window below. 0 disables the local cap.
  directory-limit: 600
  directory-limit-window-minutes: 10
  # Outbound routing for name lookups only: `inherit` uses JVM proxy settings; `direct` bypasses JVM
  # HTTP proxies. Does not affect Mojang session handshakes or Microsoft sign-in.
  directory-network: "inherit"
  # Maximum Mojang session handshakes started across the proxy per minute.
  session-handshakes-per-minute: 60
  # Minimum seconds between session handshake attempts for the same IP and name.
  session-retry-seconds: 5
  # Cooldown backoff after incomplete or failed session handshakes (doubles up to the max below).
  session-failure-backoff-seconds: 30
  session-failure-max-backoff-seconds: 120
  session-timeout-seconds: 30

post-login:
  # Target backend server name after authentication. Empty uses the proxy's default server order.
  server: ""

messages:
  # Fallback language when a player's client locale has no matching file in `messages/`.
  locale: "zh_CN"

limbo:
  motd: "KyokouAuth"
  # Waiting coordinates in the isolated verification world.
  spawn:
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  view-distance: 2
  # Biome resource key resolved per client protocol version (legacy `biome-id` is still read if set).
  biome: "minecraft:plains"
  # Optional WorldEdit Sponge v2/v3 .schem file in this plugin's data directory.
  # Placement is the minimum corner of the schematic; set spawn separately.
  map:
    file: ""
    x: 0
    y: 63
    z: 0
    # false: reject if any supported client lacks a state; true: show that state as air.
    unknown-blocks-as-air: false
  keep-alive-seconds: 10
  keep-alive-timeout-seconds: 30
  # Seconds allowed for a connection to finish entering the verification screen.
  join-timeout-seconds: 30
  # Optional static sidebar while the player is in Limbo. No placeholders or refreshes.
  # RichText colors (including <#RRGGBB>) and decorations are supported; quote each line.
  # At most 15 lines, top to bottom, with at most 512 characters per title or line.
  sidebar:
    enabled: false
    title: "<#55DDF7>KyokouAuth</#55DDF7>"
    lines:
      - "<gray>Microsoft sign-in</gray>"
      - "Follow the instructions in chat."
