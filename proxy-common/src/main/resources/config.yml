# KyokouAuth on Velocity / BungeeCord
#
# Settings are loaded once at startup. Missing keys fall back to built-in defaults, and a missing
# file is created from the plugin jar. `/kyokouauth reload` reloads message files only; changes in
# this file take effect after restarting the proxy.

database:
  # sqlite | h2 | mysql | mariadb | postgresql
  type: "sqlite"
  # File name inside `plugins/kyokouauth/` for SQLite, or database name for server dialects.
  database: "kyokouauth"
  host: "127.0.0.1"
  # 0 uses the default port for the selected database type.
  port: 0
  username: ""
  password: ""
  pool-size: 4
  # Repository for downloading missing JDBC drivers into `plugins/kyokouauth/libraries/`.
  driver-repository: "https://repo1.maven.org/maven2"
  auto-download-driver: true

session:
  # Hours a verified Microsoft role stays trusted before requiring sign-in again. 0 disables reuse.
  hours: 12
  # Require the same client IP for session reuse. Disable only when players share one NAT/tunnel IP.
  bind-address: true

bedrock:
  # Accept Bedrock logins verified by Floodgate 2.2.5 on this proxy (`auth-type: floodgate` on Geyser).
  # When `role-selection.enabled` is false, only unlinked Bedrock players are admitted under their
  # Floodgate prefix; linked accounts require `role-selection.enabled: true` and an official global link.
  enabled: false

role-selection:
  # Let linked Bedrock players choose between their server Microsoft role and linked Java role.
  # Each role keeps its own UUID, name, skin and player data. Independent of `bedrock.enabled`.
  enabled: false
  # Seconds allowed on the role menu before disconnecting (5..600). Closing the menu never selects a role.
  timeout-seconds: 60
  # Seconds a chosen role waits for one manual reconnect when switching UUID or name (5..120).
  hint-ttl-seconds: 30

verification:
  # Move a player's Microsoft binding to a new free non-premium name after signing in with the same
  # Microsoft account. Their UUID stays the same and the old name is released.
  auto-rename: true
  # Seconds allowed to finish Microsoft device-code sign-in before disconnecting.
  timeout-seconds: 300
  # Minimum seconds between Microsoft token polls; longer intervals from Microsoft always take priority.
  poll-interval-seconds: 5
  # Command roots hidden and blocked until verification or role selection completes (no `/` or args).
  # List standalone aliases separately. `[]` clears command blocking; `["*"]` blocks all commands.
  # Unauthenticated players can never switch backend servers regardless of this list.
  blocked-commands:
    - server

safety:
  # Maximum connection attempts per IP per minute. 0 disables the limit.
  connections-per-minute: 10
  # Capacity caps for pending logins and background auth workers; overflow is rejected immediately.
  pending-login-limit: 4096
  io-workers: 4
  io-queue-capacity: 256

premium:
  # Maximum uncached Mojang name lookups within the window below. 0 disables the local cap.
  directory-limit: 600
  directory-limit-window-minutes: 10
  # Outbound routing for name lookups only: `inherit` uses JVM proxy settings; `direct` bypasses JVM
  # HTTP proxies. Does not affect Mojang session handshakes or Microsoft sign-in.
  directory-network: "inherit"
  # Maximum Mojang session handshakes started across the proxy per minute.
  session-handshakes-per-minute: 60
  # Minimum seconds between session handshake attempts for the same IP and name.
  session-retry-seconds: 5
  # Cooldown backoff after incomplete or failed session handshakes (doubles up to the max below).
  session-failure-backoff-seconds: 30
  session-failure-max-backoff-seconds: 120
  session-timeout-seconds: 30

post-login:
  # Target backend server name after authentication. Empty uses the proxy's default server order.
  server: ""

messages:
  # Fallback language when a player's client locale has no matching file in `messages/`.
  locale: "zh_CN"

limbo:
  motd: "KyokouAuth"
  # Waiting coordinates in the isolated verification world.
  spawn:
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  view-distance: 2
  # Biome resource key resolved per client protocol version (legacy `biome-id` is still read if set).
  biome: "minecraft:plains"
  keep-alive-seconds: 10
  keep-alive-timeout-seconds: 30
  # Seconds allowed for a connection to finish entering the verification screen.
  join-timeout-seconds: 30
