# KyokouAuth player messages
#
# Syntax: <#RRGGBB> hex colour, <gray> and friends named colours, <newline> line break,
# <click:open_url:'URL'>…</click> clickable link. Angle-bracket placeholders are filled at runtime;
# unknown tags are shown literally.
#
# Palette
#   #22D3EE  brand         #FFFFFF  text
#   #D4D4D8  muted         #8B8B94  faint
#   #4ADE80  success       #FACC15  warning      #F87171  danger

login:
  directory-throttled: "<#FACC15>Mojang name lookup is temporarily limited</#FACC15><newline><#D4D4D8><reason><newline><#8B8B94>Known players are unaffected; please try again shortly"
  directory-busy: "<#FACC15>Login is busy checking player names</#FACC15><newline><#D4D4D8>Please wait a moment before reconnecting"
  busy: "<#FACC15>Login is busy</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Name lookup limit reached; please try again shortly"
  invalid-name: "<#F87171>Invalid player name</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Use 3–16 letters, numbers or underscores"
  name-taken: "<#F87171>This name is bound to another Microsoft account</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Pick another name or sign in with that account"
  premium-name: "<#F87171>This name belongs to a Java Edition account</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Join with the official launcher, or choose another name"
  premium-retry: "<#FACC15>Too many login attempts for this Java name</#FACC15><newline><#D4D4D8>Wait a moment and try again, or use a different name"
  premium-in-flight: "<#FACC15>This name is already signing in</#FACC15><newline><#D4D4D8>Wait for the previous connection to finish"
  premium-backoff: "<#FACC15>Java login check is cooling down</#FACC15><newline><#D4D4D8>Wait a moment before retrying; repeated failures extend the wait"
  identity-already-bound: "<#FACC15>Your Microsoft account is already bound to <name></#FACC15><newline><#D4D4D8>Auto-rename is off; join as <name> or ask an admin to rename you"
  name-changed: "<#FACC15>Your character has been renamed to <name></#FACC15><newline><#D4D4D8>Please reconnect using <name>"
  premium-busy: "<#FACC15>Java login verification is busy</#FACC15><newline><#D4D4D8>Wait a moment instead of reconnecting repeatedly"
  premium-name-claimed: "<#F87171>This name is now owned by a Java Edition account</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Ask an admin to change your server name"
  identity-renamed: "<#FACC15>Your name was updated</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect with your new name"
  directory-unavailable: "<#F87171>Cannot reach Mojang verification right now</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  proxy: "<#F87171>Server forwarding is misconfigured</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Please let a server admin know"
  internal-error: "<#F87171>Could not complete sign-in</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Please try again, or contact a server admin if this continues"
  too-many-connections: "<#FACC15>Connecting too fast</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Wait a moment and try again"

limbo:
  unsupported-version: "<#FACC15>Unsupported game version. Please join with Minecraft 1.21–26.3 (release)."
  title: "<#22D3EE>Sign in with Microsoft"
  subtitle: "<#D4D4D8>Click the link in chat to verify"
  command-blocked: "<#FACC15>Finish signing in or choosing a role first"

bedrock:
  disabled: "<#FACC15>Bedrock Edition login is not enabled on this server. Contact a server admin."
  unavailable: "<#F87171>Bedrock login service is temporarily unavailable. Please try again later or contact an admin."
  provider-denied: "<#F87171>Could not verify your Bedrock sign-in. Restart the game and reconnect."
  linked: "<#FACC15>Linked-account role selection is not enabled on this server. Contact a server admin."
  invalid-identity: "<#F87171>Your Bedrock account info could not be verified. Please reconnect."
  unsafe-name: "<#FACC15>Your Bedrock player name does not match this server's prefix rules. Contact a server admin."
  stale: "<#FACC15>This login check expired. Please reconnect to the server."

role-selection:
  title: "Choose a role"
  microsoft: "<#22D3EE>Microsoft role</#22D3EE> <gray>»</gray> <#FFFFFF><name>"
  premium: "<#22D3EE>Java role</#22D3EE> <gray>»</gray> <#FFFFFF><name>"
  enter: "<gray>Click to enter the server"
  retry: "<#FACC15>Role unavailable</#FACC15> <gray>»</gray> <gray>Reconnect and try again"
  expired: "<#FACC15>Selection timed out</#FACC15> <gray>»</gray> <gray>Please reconnect"
  reconnect: "Role selected. Please reconnect from the server list to join."

verification:
  command-blocked: "<#FACC15>Finish verification or role selection before using commands"
  starting: "<#22D3EE>Contacting Microsoft for your sign-in code...</#22D3EE><newline><#D4D4D8>Hang tight — no need to reconnect"
  confirming: "<#22D3EE>Microsoft sign-in complete — confirming your Xbox identity..."
  start-unavailable: "<#FACC15>Microsoft sign-in is temporarily unreachable</#FACC15><newline><#D4D4D8>Please wait a moment and reconnect"
  start-busy: "<#FACC15>Microsoft sign-in is rate limited</#FACC15><newline><#D4D4D8>Please wait a moment instead of reconnecting repeatedly"
  prompt: "<#22D3EE>Microsoft sign-in<newline><click:open_url:'<url>'><#FFFFFF><u><url></u></#FFFFFF></click><newline><#D4D4D8>Or visit microsoft.com/link and enter <#FFFFFF><code></#FFFFFF><newline><#8B8B94>Expires in <minutes> min"
  start-failed: "<#F87171>Could not start Microsoft sign-in</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Please reconnect and try again"
  expired: "<#FACC15>Sign-in timed out</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect for a new code"
  declined: "<#FACC15>Microsoft sign-in was cancelled</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect if you want to join"
  retry: "<#F87171>Sign-in did not complete</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Please reconnect and try again"
  xbox-failed: "<#F87171>Cannot use this Microsoft account</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  refused: "<#F87171>Cannot use this name</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  success: "<#4ADE80>Signed in</#4ADE80> <#8B8B94>»</#8B8B94> <#D4D4D8>Welcome back, <#FFFFFF><name>"
  renamed-reconnect: "<#4ADE80>Renamed <from> to <name></#4ADE80><newline><#D4D4D8>Your character data is kept — reconnect as <name> to play"
  reconnect: "<#4ADE80>Signed in</#4ADE80> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect once to join the server"

command:
  busy: "<#FACC15>Auth service is busy; please try again shortly"
  no-permission: "<#F87171>You do not have permission to use this command"
  unknown-subcommand: "<#F87171>Unknown subcommand <#FFFFFF><name></#FFFFFF></#F87171><newline><#D4D4D8>Run /kyokouauth to list commands"
  usage-header: "<#8B8B94>[</#8B8B94><#22D3EE>KyokouAuth</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8>admin commands"
  usage-whois: "<#8B8B94>- [</#8B8B94><#22D3EE>whois</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>view binding info"
  usage-session: "<#8B8B94>- [</#8B8B94><#22D3EE>session</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>view session status"
  usage-verify: "<#8B8B94>- [</#8B8B94><#22D3EE>verify</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><player> <#8B8B94>| <#D4D4D8>resend sign-in code"
  usage-unbind: "<#8B8B94>- [</#8B8B94><#22D3EE>unbind</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>remove binding"
  usage-rename: "<#8B8B94>- [</#8B8B94><#22D3EE>rename</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><old> <new> <#8B8B94>| <#D4D4D8>change bound name"
  usage-untrust: "<#8B8B94>- [</#8B8B94><#22D3EE>untrust</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>clear session"
  usage-status: "<#8B8B94>- [</#8B8B94><#22D3EE>status</#22D3EE><#8B8B94>]</#8B8B94> <#8B8B94>| <#D4D4D8>show status"
  usage-reload: "<#8B8B94>- [</#8B8B94><#22D3EE>reload</#22D3EE><#8B8B94>]</#8B8B94> <#8B8B94>| <#D4D4D8>reload message files"
  reloaded: "<#4ADE80>Message files reloaded <#8B8B94>»</#8B8B94> <#D4D4D8>config.yml changes require a proxy restart"
  status: "<#8B8B94>Storage <#FFFFFF><dialect><newline><#8B8B94>Session <#FFFFFF><session><#D4D4D8> h<newline><#8B8B94>Locale <#FFFFFF><locale><newline><#8B8B94>Verifying <#FFFFFF><verifying><newline><#8B8B94>Mojang lookups <#FFFFFF><budget><newline><#8B8B94>Identity cache <#FFFFFF><cached>"
  unknown-name: "<#F87171>No binding found for <#FFFFFF><name>"
  unknown-player: "<#F87171><#FFFFFF><name></#FFFFFF> is not online"
  whois: "<#8B8B94>Name <#FFFFFF><name><newline><#8B8B94>UUID <#FFFFFF><uuid><newline><#8B8B94>Kind <#FFFFFF><kind><newline><#8B8B94>Subject <#FFFFFF><subject><newline><#8B8B94>Gamertag <#FFFFFF><gamertag>"
  session: "<#8B8B94>Player <#FFFFFF><name><newline><#8B8B94>Address <#FFFFFF><address><newline><#8B8B94>Remaining <#FFFFFF><minutes><#D4D4D8> min"
  session-none: "<#D4D4D8><#FFFFFF><name></#FFFFFF> has no active session"
  not-verifying: "<#D4D4D8><#FFFFFF><name></#FFFFFF> is not currently verifying"
  verify-resent: "<#4ADE80>Sent a new sign-in code to <#FFFFFF><name>"
  unbound: "<#4ADE80>Removed the binding for <#FFFFFF><name>"
  untrusted: "<#4ADE80>Cleared the session for <#FFFFFF><name>"
  renamed: "<#4ADE80>Renamed <#FFFFFF><from></#FFFFFF> to <#FFFFFF><to>"
  rename-taken: "<#F87171><#FFFFFF><name></#FFFFFF> is already bound to <#FFFFFF><owner></#FFFFFF>"
  internal-error: "<#F87171>Command failed; check the console log"
