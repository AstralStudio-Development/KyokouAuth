# KyokouAuth player messages
#
# Syntax: <#RRGGBB> hex colour, <gray> and friends named colours, <newline> line break,
# <click:open_url:'URL'>…</click> clickable link. Angle-bracket placeholders are filled at runtime;
# unknown tags are shown literally.
#
# Palette
#   #22D3EE  brand         #FFFFFF  text
#   #D4D4D8  muted         #8B8B94  faint
#   #4ADE80  success       #FACC15  warning      #F87171  danger

login:
  directory-throttled: "<#FACC15>Mojang name lookup is temporarily limited</#FACC15><newline><#D4D4D8><reason><newline><#8B8B94>Known players are unaffected; please try again shortly"
  directory-busy: "<#FACC15>Login is busy checking player names</#FACC15><newline><#D4D4D8>Please wait a moment before reconnecting"
  busy: "<#FACC15>Login is busy</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Name lookup limit reached; please try again shortly"
  invalid-name: "<#F87171>Invalid player name</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Use 3–16 letters, numbers or underscores"
  name-taken: "<#F87171>This name is bound to another Microsoft account</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Pick another name or sign in with that account"
  premium-name: "<#F87171>This name belongs to a Java Edition account</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Join with the official launcher, or choose another name"
  premium-retry: "<#FACC15>Too many login attempts for this Java name</#FACC15><newline><#D4D4D8>Wait a moment and try again, or use a different name"
  premium-in-flight: "<#FACC15>This name is already signing in</#FACC15><newline><#D4D4D8>Wait for the previous connection to finish"
  premium-backoff: "<#FACC15>Java login check is cooling down</#FACC15><newline><#D4D4D8>Wait a moment before retrying; repeated failures extend the wait"
  identity-already-bound: "<#FACC15>Your Microsoft account is already bound to <name></#FACC15><newline><#D4D4D8>Auto-rename is off; join as <name> or ask an admin to rename you"
  name-changed: "<#FACC15>Your character has been renamed to <name></#FACC15><newline><#D4D4D8>Please reconnect using <name>"
  premium-busy: "<#FACC15>Java login verification is busy</#FACC15><newline><#D4D4D8>Wait a moment instead of reconnecting repeatedly"
  premium-name-claimed: "<#F87171>This name is now owned by a Java Edition account</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Ask an admin to change your server name"
  identity-renamed: "<#FACC15>Your name was updated</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect with your new name"
  directory-unavailable: "<#F87171>Cannot reach Mojang verification right now</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  proxy: "<#F87171>Server forwarding is misconfigured</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Please let a server admin know"
  internal-error: "<#F87171>Could not complete sign-in</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Please try again, or contact a server admin if this continues"
  too-many-connections: "<#FACC15>Connecting too fast</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Wait a moment and try again"

limbo:
  unsupported-version: "<#FACC15>Unsupported game version. Please join with Minecraft 1.21–26.3 (release)."
  title: "<#22D3EE>Sign in with Microsoft"
  subtitle: "<#D4D4D8>Click the link in chat to verify"
  command-blocked: "<#FACC15>Finish signing in or choosing a role first"

bedrock:
  disabled: "<#FACC15>Bedrock Edition login is not enabled on this server. Contact a server admin."
  unavailable: "<#F87171>Bedrock login service is temporarily unavailable. Please try again later or contact an admin."
  provider-denied: "<#F87171>Could not verify your Bedrock sign-in. Restart the game and reconnect."
  linked: "<#FACC15>Linked-account role selection is not enabled on this server. Contact a server admin."
  invalid-identity: "<#F87171>Your Bedrock account info could not be verified. Please reconnect."
  unsafe-name: "<#FACC15>Your Bedrock player name does not match this server's prefix rules. Contact a server admin."
  stale: "<#FACC15>This login check expired. Please reconnect to the server."

role-selection:
  title: "Choose a role"
  microsoft: "<#22D3EE>Microsoft role</#22D3EE> <gray>»</gray> <#FFFFFF><name>"
  premium: "<#22D3EE>Java role</#22D3EE> <gray>»</gray> <#FFFFFF><name>"
  enter: "<gray>Click to enter the server"
  retry: "<#FACC15>Role unavailable</#FACC15> <gray>»</gray> <gray>Reconnect and try again"
  expired: "<#FACC15>Selection timed out</#FACC15> <gray>»</gray> <gray>Please reconnect"
  reconnect: "Role selected. Please reconnect from the server list to join."

verification:
