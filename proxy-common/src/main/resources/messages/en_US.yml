  status: "<#8B8B94>Storage <#FFFFFF><dialect><newline><#8B8B94>Session <#FFFFFF><session><#D4D4D8> h<newline><#8B8B94>Locale <#FFFFFF><locale><newline><#8B8B94>Verifying <#FFFFFF><verifying><newline><#8B8B94>Mojang lookups <#FFFFFF><budget><newline><#8B8B94>Identity cache <#FFFFFF><cached>"
  unknown-name: "<#F87171>No binding found for <#FFFFFF><name>"
  unknown-player: "<#F87171><#FFFFFF><name></#FFFFFF> is not online"
  whois: "<#8B8B94>Name <#FFFFFF><name><newline><#8B8B94>UUID <#FFFFFF><uuid><newline><#8B8B94>Kind <#FFFFFF><kind><newline><#8B8B94>Subject <#FFFFFF><subject><newline><#8B8B94>Gamertag <#FFFFFF><gamertag>"
  session: "<#8B8B94>Player <#FFFFFF><name><newline><#8B8B94>Address <#FFFFFF><address><newline><#8B8B94>Remaining <#FFFFFF><minutes><#D4D4D8> min"
