  scan-cancelling: "<#FACC15>Cancellation requested; the running read will finish safely and clean its stage. The active snapshot is unchanged."
  scan-cancelled: "<#FACC15>Migration scan cancelled; its temporary snapshot was not activated."
  scan-not-cancellable: "<#FACC15>No cancellable scan or preview; activation and disabling cannot be interrupted by this command."
  snapshot-disabled: "<#FACC15>New legacy claims disabled persistently. Existing identities and UUID ownership remain valid, including after restart."
  snapshot-unavailable: "<#F87171>This proxy adapter does not support local legacy claims."
  snapshot-failed: "<#F87171>Migration did not complete.<#D4D4D8> Check inbox/AuthMe/config.yml, source connectivity/TLS, a consistent stopped-server backup, scan limits and confirmation expiry. Failed scans do not replace the active snapshot."
