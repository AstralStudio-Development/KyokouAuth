  rename-taken: "<#F87171><#FFFFFF><name></#FFFFFF> is already bound to <#FFFFFF><owner></#FFFFFF>"
  internal-error: "<#F87171>Command failed; check the console log"

migration:
  scan-started: "<#22D3EE>Background scan started.<#D4D4D8> Reading migration/inbox; use ka migration progress or ka migration cancel. The old source is read-only and any active snapshot is unchanged."
