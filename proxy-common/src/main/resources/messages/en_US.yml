  start-unavailable: "<#FACC15>Microsoft sign-in is temporarily unreachable</#FACC15><newline><#D4D4D8>Please wait a moment and reconnect"
  start-busy: "<#FACC15>Microsoft sign-in is rate limited</#FACC15><newline><#D4D4D8>Please wait a moment instead of reconnecting repeatedly"
  prompt: "<#22D3EE>Microsoft sign-in<newline><click:open_url:'<url>'><#FFFFFF><u><url></u></#FFFFFF></click><newline><#D4D4D8>Or visit microsoft.com/link and enter <#FFFFFF><code></#FFFFFF><newline><#8B8B94>Expires in <minutes> min"
  start-failed: "<#F87171>Could not start Microsoft sign-in</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Please reconnect and try again"
  expired: "<#FACC15>Sign-in timed out</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect for a new code"
  declined: "<#FACC15>Microsoft sign-in was cancelled</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect if you want to join"
  retry: "<#F87171>Sign-in did not complete</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Please reconnect and try again"
  xbox-failed: "<#F87171>Cannot use this Microsoft account</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  refused: "<#F87171>Cannot use this name</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  success: "<#4ADE80>Signed in</#4ADE80> <#8B8B94>»</#8B8B94> <#D4D4D8>Welcome back, <#FFFFFF><name>"
  renamed-reconnect: "<#4ADE80>Renamed <from> to <name></#4ADE80><newline><#D4D4D8>Your character data is kept — reconnect as <name> to play"
  reconnect: "<#4ADE80>Signed in</#4ADE80> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect once to join the server"

command:
  busy: "<#FACC15>Auth service is busy; please try again shortly"
  no-permission: "<#F87171>You do not have permission to use this command"
  unknown-subcommand: "<#F87171>Unknown subcommand <#FFFFFF><name></#FFFFFF></#F87171><newline><#D4D4D8>Run /kyokouauth to list commands"
  usage-header: "<#8B8B94>[</#8B8B94><#22D3EE>KyokouAuth</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8>admin commands"
  usage-whois: "<#8B8B94>- [</#8B8B94><#22D3EE>whois</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>view binding info"
  usage-session: "<#8B8B94>- [</#8B8B94><#22D3EE>session</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>view session status"
  usage-verify: "<#8B8B94>- [</#8B8B94><#22D3EE>verify</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><player> <#8B8B94>| <#D4D4D8>resend sign-in code"
  usage-unbind: "<#8B8B94>- [</#8B8B94><#22D3EE>unbind</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>remove binding"
  usage-rename: "<#8B8B94>- [</#8B8B94><#22D3EE>rename</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><old> <new> <#8B8B94>| <#D4D4D8>change bound name"
  usage-untrust: "<#8B8B94>- [</#8B8B94><#22D3EE>untrust</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>clear session"
  usage-status: "<#8B8B94>- [</#8B8B94><#22D3EE>status</#22D3EE><#8B8B94>]</#8B8B94> <#8B8B94>| <#D4D4D8>show status"
  usage-reload: "<#8B8B94>- [</#8B8B94><#22D3EE>reload</#22D3EE><#8B8B94>]</#8B8B94> <#8B8B94>| <#D4D4D8>reload message files"
  migration-usage: "<#22D3EE>Legacy claims · proxy console<newline><#FFFFFF>/ka migration scan<#D4D4D8> — prepare an inactive local snapshot from migration/inbox<newline><#FFFFFF>/ka migration progress<#D4D4D8> — show background progress<newline><#FFFFFF>/ka migration cancel<#D4D4D8> — cancel a scan or unconfirmed snapshot<newline><#FFFFFF>/ka migration disable<#D4D4D8> — stop new claims without revoking identities<newline><#FFFFFF>/ka migration issues [page]<#D4D4D8> — list missing, ambiguous and conflicting records<newline><#FFFFFF>/ka migration confirm <token><#D4D4D8> — confirm the scan and register the batch<newline><#FFFFFF>/ka migration check|import <batch> <oldName> <actualHistoricalUuid-v3><#D4D4D8> — single-record exception handling<newline><#FFFFFF>/ka migration pending<#D4D4D8> — list waiting sessions<newline><#FFFFFF>/ka migration approve <session> <recordId> verified<#D4D4D8> — authorize this session after independently verifying legacy account ownership"
