  phase-scanning_source: "reading source into a bounded local stage"
  phase-matching_profiles: "source closed; matching local historical profiles"
  phase-ready: "preview ready, awaiting confirmation"
  phase-activating: "registering candidates and activating local snapshot"
  phase-active: "using local snapshot without the old database"
  phase-disabling: "disabling new claims"
  phase-disabled: "new claims disabled"
  phase-cancelled: "scan cancelled"
  phase-expired: "preview expired; private stage queued for cleanup"
  phase-failed: "operation failed"
  scan-summary: "<#22D3EE>AuthMe preflight<#D4D4D8>: source <total>, matched <matched>, ready <ready>, existing <existing>, account issues <issues>, invalid historical files/records <invalid>.<newline><#8B8B94>No source/world writes or player identity binding."
  scan-confirm: "<#D4D4D8>Review ka migration issues. Confirm the source is stopped and the account/world backups match, then run <#FFFFFF>ka migration confirm <token><#D4D4D8> within 5 minutes, once. This activates the local snapshot; claims no longer contact the old DB. Existing unprotected connections must reconnect."
  scan-required: "<#FACC15>Run ka migration scan first; there is no current unexpired scan."
  issues-page: "<#22D3EE>Migration issues <page>/<pages><#D4D4D8>, <total> records; only safely matched profiles can be registered."
  issue-entry: "<#FACC15><name><#D4D4D8>: <reason>"
