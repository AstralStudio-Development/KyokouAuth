# KyokouAuth 玩家消息
#
# 语法：<#RRGGBB> 十六进制颜色，<gray> 等命名颜色，<newline> 换行，
# <click:open_url:'URL'>…</click> 可点击链接。尖括号占位符在运行时替换；未识别的标签按原样显示。
