migration:
  scan-usage: "<#22D3EE>扫描参数<#D4D4D8>：ka migration scan [--source-host <主机>] [--source-port <端口>] [--local-source]<newline>本地地址须用 --local-source 明确确认数据库就在当前代理运行环境；跨机请覆盖为可达主机。账号密码和表字段仍读取复制来的配置，不接受凭据型 URL。"
  source-sqlite: "<#22D3EE>本轮来源：SQLite<#D4D4D8>；数据库文件 <database>。按旧配置指定文件读取，不合并其他残留库。"
  source-remote: "<#22D3EE>本轮来源：<type><#D4D4D8>；主机 <host>；端口 <port>；数据库 <database>。其余字段沿用旧配置，凭据不显示。"
  failure-local_source_confirmation_required: "<#FACC15>本地数据库地址的来源环境尚未确认，未连接数据库。<#D4D4D8>localhost/回环地址指当前代理环境，不一定是旧机器；确认同环境后用 ka migration scan --local-source，否则用 --source-host <旧库可达主机>，必要时加 --source-port <端口>。不会回退读取残留 SQLite。"
  failure-invalid_source_selection: "<#FACC15>来源地址或覆盖参数无效，未连接数据库。<#D4D4D8>请使用真实主机名/常规 IP 和 1–65535 端口，不要输入用户名密码 URL、通配监听地址或歧义数字 IP；SQLite 来源不接受主机/端口或本地确认覆盖。"
  last-failure: "<#FACC15>本轮失败原因：<#D4D4D8><reason>"
  failure-missing_inbox_config: "<#FACC15>收件配置缺失或不是普通文件。<#D4D4D8>请把旧 AuthMe 的配置复制到 migration/inbox/AuthMe/config.yml，再执行 ka migration scan；无需修改本插件配置。"
  failure-invalid_source_config: "<#FACC15>无法识别复制来的 AuthMe 配置。<#D4D4D8>必须明确包含 DataSource.backend（SQLITE/MYSQL/MARIADB）并使用受支持的 SHA256；缺少类型时不会猜测或读取旧 .db。请复制完整旧配置，不要手工猜字段或发送凭据。"
  failure-source_unavailable: "<#FACC15>旧来源读取或快照导出失败。<#D4D4D8>请检查数据库文件是否存在且已停写一致、只读访问、驱动、连接/TLS 和账号数量上限。"
  failure-preflight_failed: "<#FACC15>本地预检或暂存写入失败。<#D4D4D8>请检查玩家档案/缓存格式、扫描上限、磁盘与目录权限；原启用快照不变。"
  failure-invalid_confirmation: "<#FACC15>没有匹配的有效确认 token，或预检已过期。<#D4D4D8>请重新 scan，检查 issues 后使用本次给出的 token 确认。"
  failure-snapshot_invalid: "<#FACC15>未启用快照的完整性校验失败。<#D4D4D8>本次不会启用，请重新 scan；不要修改生成的快照文件。"
  failure-target_import_failed: "<#FACC15>目标登记未完成，或预检后的历史/目标状态已变化。<#D4D4D8>请重扫后确认；已登记的同批候选会幂等识别。"
  failure-activation_failed: "<#FACC15>本地快照启停或切换未完成。<#D4D4D8>请检查磁盘空间、目录权限和文件占用后重试；不要删除当前有效快照。"
  failure-no_active_snapshot: "<#FACC15>尚未启用过本地迁移快照，无需停用。<#D4D4D8>普通登录不受影响；需要迁移时先复制材料并 scan。"
  failure-operation_failed: "<#F87171>迁移操作遇到未分类错误。<#D4D4D8>请查看控制台安全错误码；不要公开数据库密码、哈希或源配置。"
  scan-started: "<#22D3EE>后台扫描已启动。<#D4D4D8>从 migration/inbox 读取复制材料；用 ka migration progress 查看进度、ka migration cancel 取消。旧库只读，当前可用快照不受影响。"
