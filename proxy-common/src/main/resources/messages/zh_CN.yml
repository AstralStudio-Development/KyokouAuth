# KyokouAuth 玩家消息
#
# 语法：<#RRGGBB> 十六进制颜色，<red> 等为命名颜色，<newline> 换行，
# <click:open_url:'URL'>…</click> 可点击文本。尖括号占位符在运行时替换。无法识别的标签会原样显示，
# 因此写错一个标签不会导致消息发不出去。
#
# 调色板
#   #22D3EE  品牌     #FFFFFF  正文
#   #D4D4D8  次要     #8B8B94  弱化
#   #4ADE80  成功     #FACC15  警告     #F87171  危险

