  scan-summary: "<#22D3EE>AuthMe 自动预检<#D4D4D8>：来源 <total>，匹配 <matched>，可登记 <ready>，已登记 <existing>，异常账号 <issues>，无效历史文件/记录 <invalid>。<newline><#8B8B94>不修改源库或世界，也不建立玩家身份绑定。"
  scan-confirm: "<#D4D4D8>先用 ka migration issues 检查异常。确认来源已停写、档案与账号库同源后，执行 <#FFFFFF>ka migration confirm <token><#D4D4D8>（5 分钟内一次有效）；这同时启用本地快照。之后玩家认领不再连接旧库，已在线的未受保护连接须重新连接。"
