<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>KyokouAuth 文档</title>
  <meta name="description" content="离线模式服务端的微软账户认证插件 —— 不放弃身份">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/vue.css">
  <style>
    :root {
      --theme-color: #3c8527;
      --sidebar-width: 19rem;
      --content-max-width: 52rem;
    }
    .sidebar { background: #f7f9f7; border-right: 1px solid #e3ebe3; }
    .sidebar ul li a { color: #33403a; }
    .sidebar ul li.active > a { color: var(--theme-color); font-weight: 600; border-right-color: var(--theme-color); }
    .sidebar ul li a:hover { color: var(--theme-color); }
    .app-name-link { font-weight: 700; letter-spacing: -0.01em; }
    .markdown-section h1 { font-weight: 700; letter-spacing: -0.02em; }
    .markdown-section h2 { border-bottom: 1px solid #e3ebe3; padding-bottom: .3em; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section code { background: #f0f4f0; color: #2f4f3a; }
    .markdown-section pre > code { background: #1e2620; }
    .markdown-section blockquote { border-left: 4px solid var(--theme-color); background: #f7f9f7; }
    .search input { border-radius: 6px; }
    .search .results-panel { border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  </style>
</head>
<body>
  <div id="app">正在加载文档…</div>

  <script>
    window.$docsify = {
      name: 'KyokouAuth',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      notFoundPage: true,
      search: {
        placeholder: '搜索文档',
        noData: '没有找到相关内容',
        depth: 3
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true
      },
      copyCode: { buttonText: '复制', errorText: '失败' }
    }
  </script>

  <script src="assets/docsify.min.js"></script>
  <script src="assets/search.min.js"></script>
</body>
</html>
