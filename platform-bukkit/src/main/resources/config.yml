# KyokouAuth
#
# 离线模式服务端的微软账户认证。
# server.properties 中须为 online-mode=false，最低 Minecraft 1.16。

# 配置结构版本，请勿修改。
config-version: 8

database:
  # sqlite | h2 | mysql | mariadb | postgresql
  type: sqlite
  # sqlite / h2 为数据文件路径；其余为数据库名
  database: kyokouauth
  host: 127.0.0.1
  port: 3306
  username: root
  password: ""
  # 嵌入式数据库始终为 1
  pool-size: 4
  # JDBC 驱动下载源，可指向镜像
  driver-repository: https://repo1.maven.org/maven2
  # 为 false 时驱动须已存在于服务器 libraries/ 目录
  auto-download-driver: true

session:
  # 验证通过后，在此小时内同一来源免于再次验证。0 为关闭
  hours: 12
  # 为 false 时不再校验来源地址。适用于 NAT 或隧道后所有人共用同一地址的环境
  bind-address: true

verification:
  # 完成微软登录的时限（秒）
  timeout-seconds: 300
  # 向微软查询结果的间隔（秒）
  poll-interval-seconds: 5

limbo:
  # 配置了 limbo.spawn 时始终使用它；此开关只决定未配置 spawn 时是否用世界出生点
  teleport-to-spawn: false
  # 固定位置，用 /kyokouauth setspawn 在游戏内写入
  spawn:
    world: ""
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  # 以大标题显示验证提示
  show-title: true
  show-bossbar: true
  # 施加失明效果
  blind: false
  # 验证中的玩家与其他玩家互相不可见
  hide-players: true

premium:
  # 握手后的会话复核地址
  session-server-url: https://sessionserver.mojang.com
  # 每个窗口内允许的 Mojang 名字查询次数。0 为不限制
  directory-limit: 600
  directory-limit-window-minutes: 10

safety:
  # 检测到代理后端时拒绝启动
  require-direct-connections: true
  # 每个来源每分钟允许的登录尝试次数。0 为不限制
  # 目的是保住 Mojang 查询配额：配额用尽后所有玩家都会被拒绝
  connections-per-minute: 10

messages:
  # 语言代码。文件位于 messages/messages_<代码>.yml，可直接编辑
  locale: zh_CN

post-login:
  # 可以游玩后把玩家送到哪个子服，空为不传送
  # 这是代理动作：需要 BungeeCord 或 Velocity，且 safety.require-direct-connections 须为 false
  # 单服部署留空即可
  server: ""
