# ============================================================
#  KyokouAuth —— 微软账户登录插件
# ============================================================
#
#  服务器必须以「离线模式」运行（server.properties 里 online-mode=false）。
#  本插件不使用原版的正版验证通道，而是自己接管登录阶段：
#    · 名字被 Mojang 持有的玩家 → 由插件完成 Mojang 握手验证
#    · 其他玩家 → 通过微软设备码证明自己的 Xbox 账户
#
#  最低支持版本：1.12（缺少必要的 UUID 设置 API 时会拒绝启动并说明原因）

# 配置文件版本。请勿手动修改。
#
# 升级插件时如果这个数字变大，说明配置结构有变化：旧文件会被备份成
# config.old.yml，然后写入新的默认配置。你的设置需要从备份里手动搬回来。
config-version: 3

# ------------------------------------------------------------
#  数据库
# ------------------------------------------------------------
database:
  # 可选：sqlite | h2 | mysql | mariadb | postgresql
  #
  # sqlite 是默认值，零配置即可使用，适合单服。
  # 群组服或多人共用请选 mysql / mariadb / postgresql。
  type: sqlite

  # sqlite：数据库文件路径。相对路径会落在插件数据目录下。
  # h2：数据库名。其余类型：服务器上的库名。
  database: kyokouauth

  host: 127.0.0.1
  port: 3306
  username: root
  password: ""

  # 连接池大小。sqlite 和 h2 固定为 1（它们是单写入的嵌入式数据库）。
  pool-size: 4

  # 数据库驱动（JDBC driver）的下载来源。
  #
  # 为了不让插件本体变成 20MB 以上，驱动不在 jar 里。插件首次启动时会把五种驱动
  # 一次性下载到服务器的 libraries/ 目录（和 Paper 自己的依赖放在一起，同样的 Maven 布局），
  # 之后启动不再联网。
  #
  # 也可以手动把驱动 jar 按 Maven 布局放进 libraries/，已存在的文件不会被覆盖，
  # 离线服务器只需要提前放好那五个 jar 即可。
  #
  # 国内服务器如果下载慢，可以换成镜像，例如：
  #   https://maven.aliyun.com/repository/central
  driver-repository: https://repo1.maven.org/maven2

  # 是否允许自动下载驱动。设为 false 时，驱动必须已经存在于 libraries/ 目录。
  auto-download-driver: true

# ------------------------------------------------------------
#  会话（免验证时长）
# ------------------------------------------------------------
session:
  # 验证通过后，同一 IP 在多少小时内免于再次验证。
  #
  # 0 表示完全不信任会话——每次进服都要重新验证。
  # 换 IP（换网络）一定需要重新验证，与本项无关。
  hours: 12

# ------------------------------------------------------------
#  验证流程
# ------------------------------------------------------------
verification:
  # 玩家需要在多少秒内完成微软登录，超时会被踢出。
  timeout-seconds: 300

  # 插件每隔多少秒向微软查询一次「玩家完成了吗」。
  poll-interval-seconds: 5

# ------------------------------------------------------------
#  Limbo（未验证玩家的等待状态）
# ------------------------------------------------------------
limbo:
  # 冻结时把玩家传送到出生点。
  # 默认关闭：原地冻结意味着不改动世界，解冻时也不会把玩家丢到意外的地方。
  teleport-to-spawn: false

  # 把验证提示以标题形式反复显示。聊天栏里的可点击链接始终会发送。
  show-title: true

  show-bossbar: true

  # 给未验证玩家施加失明效果。默认关闭，让玩家能看到自己即将进入的世界。
  blind: false

# 已绑定的玩家是否强制使用绑定的名字（不允许客户端自行改名）。
enforce-bound-name: true

# ------------------------------------------------------------
#  正版玩家
# ------------------------------------------------------------
premium:
  # 握手时向哪里查询「这个会话是否真的成立」。
  #
  # 请求里只包含玩家名和一段哈希，不包含任何密钥，因此指向镜像不构成凭据泄露；
  # 但它决定了正版登录是否被接受，改错等同于改错数据库地址。
  session-server-url: https://sessionserver.mojang.com

  # 判断「这个名字是不是正版」时，向 Mojang 查询的频率上限。
  #
  # Mojang 对同一个 IP 大约允许 600 次 / 10 分钟，超过就会返回 429。
  # 这里自己先设一个额度，是在撞墙之前停手，而不是等被拒绝了再补救。
  # 命中缓存的名字不计入额度，所以稳态下正常运营远远用不满。
  #
  # 额度用尽时，插件会拒绝需要查询 Mojang 的新连接（而不是把未知名字当成无主，
  # 那会让正版名字被任意占用）。设为 0 表示不限制——不建议，除非前面有反向代理分担。
  directory-limit: 600
  directory-limit-window-minutes: 10

# ------------------------------------------------------------
#  安全
# ------------------------------------------------------------
safety:
  # 检测到服务器处于代理后端时拒绝启动。
  #
  # 代理转发会让本服看不到登录握手，所有玩家都会被当成未验证——
  # 这会让认证静默失效，因此宁可拒绝启动。
  require-direct-connections: true

# ------------------------------------------------------------
#  语言
# ------------------------------------------------------------
messages:
  # 游戏内消息、控制台提示所使用的语言。
  #
  # 内置 zh_CN（简体中文）和 en_US（英文）。
  # 想加别的语言：把 messages_zh_CN.yml 复制到插件数据目录，
  # 改名为 messages_<语言代码>.yml，翻译后把这里改成对应的语言代码。
  locale: zh_CN
