name: KyokouAuth
main: moe.ryuu.kyokouauth.bukkit.KyokouAuthPlugin
version: '${version}'
description: Microsoft-account login for offline-mode servers. Premium players keep their real UUID; everyone else proves a Microsoft account.
authors: [Ryuu]
website: https://github.com/ryuu/kyokouauth

# Floodgate must load first: its presence decides whether Bedrock players are admitted without a
# second sign-in, and that check runs in the very first login event.
softdepend: [floodgate, PlaceholderAPI, SkinsRestorer]

# api-version marks the floor the plugin is written against. 1.16 is the first version with hex
# colours, and it is also the first one whose Adventure ships the serialisers the message layer
# needs, so nothing older is supported on purpose.
api-version: '1.16'

commands:
  kyokouauth:
    description: KyokouAuth administration
    usage: /kyokouauth <whois|session|unbind|rename|untrust|verify|status|reload>
    aliases: [ka, auth]
    # No `permission:` here on purpose. Bukkit evaluates it before the executor runs, so any value
    # would refuse the command for every non-admin - and `/kyokouauth link` is a player action, not
    # an administrative one. The executor performs the check itself for every other subcommand.

permissions:
  kyokouauth.admin:
    description: Full access to KyokouAuth administration
    default: op
