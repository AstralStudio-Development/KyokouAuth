login:
  invalid-name: "<red>That username is not valid."
  name-taken: "<red>That name does not belong to your Microsoft account."
  premium-name: "<red>That name belongs to a premium account. Sign in with the official launcher."
  premium-name-claimed: "<red>That name has been registered by a premium account.</red><newline><gray>Ask an administrator to rename you with /kyokouauth rename."
  identity-renamed: "<red>Your account has been renamed. Reconnect to continue."
  directory-unavailable: "<red>Mojang is unreachable. Try again later."
  proxy: "<red>Server misconfigured. Contact an administrator."
  internal-error: "<red>Login failed. Contact an administrator."
  concurrent: "<red>This account is already logging in elsewhere."
  refused-by-plugin: "<red>Login refused by another plugin."

limbo:
  title: "<aqua>Complete Microsoft verification"
  subtitle: "<gray>Click the link in chat"
  command-blocked: "<red>Commands are unavailable until you verify."

handshake:
  not-authenticated: "<red>Your client did not pass premium verification. Sign in with the official launcher."
  session-unavailable: "<red>Mojang is unreachable. Try again later."
  failed: "<red>Login handshake failed. Reconnect to retry."

verification:
  prompt: "<aqua><bold>Complete Microsoft verification</bold></aqua><newline><newline><click:open_url:'<url>'><u><white><url></white></u></click><newline><newline><gray>Or visit <white>microsoft.com/link</white> and enter <yellow><code></yellow><newline><newline><gray>Valid for <minutes> minutes."
  start-failed: "<red>Could not start Microsoft sign-in. Reconnect to retry."
  expired: "<red>Verification timed out. Reconnect to retry."
  declined: "<red>Sign-in cancelled. Reconnect to retry."
  retry: "<red>Verification failed. Reconnect to retry."
  xbox-failed: "<red>That Microsoft account is unusable: <reason>"
  name-mismatch: "<red>Your Microsoft account is <white><proven></white>. Connect with that name."
  refused: "<red>Cannot bind that name: <reason>"
  success: "<green>Verified. Welcome back, <white><name></white>."
  reconnect: "<green>Verified. Reconnect to join."

command:
  no-permission: "<red>No permission."
  usage: "<yellow>/kyokouauth <whois|unbind|rename|untrust|status|reload>"
  reloaded: "<green>Config and locale files reloaded."
  status: "<gray>Storage: <white><dialect></white>　Session: <white><session></white>h　Locale: <white><locale></white>"
  unknown-name: "<red>No record for <white><name></white>."
  whois: "<gray>Name: <white><name></white>　UUID: <white><uuid></white><newline><gray>Kind: <white><kind></white>　Subject: <white><subject></white>　Gamertag: <white><gamertag></white>"
  unbound: "<green>Unbound <white><name></white>."
  untrusted: "<green>Cleared the session for <white><name></white>."
  renamed: "<green>Renamed <white><from></white> to <white><to></white>."
  rename-taken: "<red><white><name></white> is held by <white><owner></white>."
  internal-error: "<red>Operation failed. Check the console."

# Console output. It is read by the server owner, so it goes through the same locale files.
console:
  enabled: "<green>KyokouAuth enabled</green><gray> (<storage>)"
  backend: "<gray>Message backend: <white><backend></white>"
  pipeline-ok: "<gray>Message rendering OK (<locale>)"
  storage-migrated: "<gray>Schema migrated to <white>v<version></white>"
  handshake-installed: "<gray>Premium handshake installed"
  handshake-unavailable: "<red>No channel hook available, so the premium handshake cannot be installed - premium players will not be able to join.<newline><gray>A supported Paper version is required."
  floodgate-detected: "<gray>Floodgate <white><version></white>"
  floodgate-broken: "<yellow>Floodgate API unavailable (<error>); Bedrock players will verify normally"
  link-extension-installed: "<gray>Wrote the Floodgate linking extension<newline><gray>Takes effect after a restart"
  link-extension-failed: "<red>Could not write the Floodgate linking extension: <error>"
  link-extension-config: "<yellow>Floodgate config needs changes: <problem>"
  placeholderapi-ok: "<gray>PlaceholderAPI expansion registered"
  placeholderapi-failed: "<yellow>PlaceholderAPI expansion failed to register: <error>"
  restriction-skipped: "<gray>No <name> event on this server; skipping that restriction"
  restriction-failed: "<yellow>Could not register the <name> listener: <error>"
  skins-restorer: "<gray>SkinsRestorer handles skins"
  database-failed: "<red>Could not open the database: <error>"

  name-claimed: "<yellow><white><name></white> is now registered by a premium account, but was bound to a Microsoft player.</yellow><newline><gray>They have no Java Edition and cannot fix this themselves. Run <white>/kyokouauth rename <name> <new name></white>."
  refuse-proxy: "<red>This server is behind a proxy; refusing to start.</red><newline><gray>The proxy terminates the login handshake, so verification would silently fail.<newline><gray>Install the plugin on a standalone server, or set safety.require-direct-connections: false."
  refuse-version: "<red>This server is older than Minecraft 1.12; refusing to start.</red><newline><gray>Current: <server><newline><gray>Assigning a player UUID needs setPlayerProfile, available from 1.12."
  refuse-pipeline: "<red>This server cannot render messages; refusing to start: <error>"
