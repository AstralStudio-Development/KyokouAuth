# KyokouAuth player messages
#
# Syntax: <#RRGGBB> is a hex colour, <red> and friends are named colours, <newline> is a line
# break, <click:open_url:'URL'>…</click> is a clickable span. Placeholders are in angle brackets and
# replaced at runtime. An unknown tag is printed literally, so a typo cannot stop a message.
#
# Palette
#   #22D3EE  brand         #FFFFFF  text
#   #D4D4D8  muted         #8B8B94  faint
#   #4ADE80  success       #FACC15  warning      #F87171  danger
#
# Shape: state the fact, then the next step, separated by ». No trailing period.

login:
  invalid-name: "<#F87171>That username is not valid</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>3-16 letters, digits or underscores"
  name-taken: "<#F87171>This name does not belong to your Microsoft account"
  premium-name: "<#F87171>This name belongs to a premium account</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Connect with the official launcher; if you already are, reconnect"
  premium-name-claimed: "<#F87171>This name is registered by a premium account</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Ask an admin to run /kyokouauth rename"
  identity-renamed: "<#FACC15>This account was renamed</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect"
  directory-unavailable: "<#F87171>Mojang is unreachable</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  proxy: "<#F87171>This server cannot complete the login handshake</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Contact an admin"
  internal-error: "<#F87171>Login failed</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Contact an admin; the console has the cause"
  concurrent: "<#FACC15>This account is signing in elsewhere</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Retry once that session ends"
  refused-by-plugin: "<#F87171>Another plugin refused this login"
  too-many-connections: "<#FACC15>Too many connection attempts</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Wait a minute and retry"

limbo:
  title: "<#22D3EE>Complete Microsoft verification"
  subtitle: "<#D4D4D8>Click the link in chat"
  command-blocked: "<#FACC15>Commands are unavailable until verification finishes</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Click the link in chat"

handshake:
  not-authenticated: "<#F87171>This client did not pass premium authentication</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Connect with the official launcher"
  session-unavailable: "<#F87171>Mojang is unreachable</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Try again later"
  failed: "<#F87171>The login handshake failed</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect"
  directory-unavailable: "<#F87171>Could not check Mojang's name directory</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Try again later"

verification:
  prompt: "<#22D3EE>Microsoft verification<newline><click:open_url:'<url>'><#FFFFFF><u><url></u></#FFFFFF></click><newline><#D4D4D8>Or enter <#FFFFFF><code></#FFFFFF> at microsoft.com/link<newline><#8B8B94>Valid for <minutes> minutes"
  start-failed: "<#F87171>Could not start the Microsoft sign-in</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect"
  expired: "<#FACC15>Verification timed out</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect"
  declined: "<#FACC15>Sign-in cancelled</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect"
  retry: "<#F87171>Verification failed</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect"
  xbox-failed: "<#F87171>This Microsoft account cannot be used</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  name-mismatch: "<#FACC15>Your Microsoft account is <#FFFFFF><proven></#FFFFFF></#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Connect with that name"
  refused: "<#F87171>This name cannot be bound</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  success: "<#4ADE80>Verified</#4ADE80> <#8B8B94>»</#8B8B94> <#D4D4D8>Welcome back, <#FFFFFF><name>"
  reconnect: "<#4ADE80>Verified</#4ADE80> <#8B8B94>»</#8B8B94> <#D4D4D8>Reconnect"

command:
  no-permission: "<#F87171>No permission"
  unknown-subcommand: "<#F87171>Unknown subcommand <#FFFFFF><name></#FFFFFF></#F87171><newline><#D4D4D8>Run /kyokouauth for the full list"
  usage-header: "<#8B8B94>[</#8B8B94><#22D3EE>KyokouAuth</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8>commands"
  usage-whois: "<#8B8B94>- [</#8B8B94><#22D3EE>whois</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>binding details"
  usage-session: "<#8B8B94>- [</#8B8B94><#22D3EE>session</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>trusted session"
  usage-verify: "<#8B8B94>- [</#8B8B94><#22D3EE>verify</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><player> <#8B8B94>| <#D4D4D8>resend the code"
  usage-unbind: "<#8B8B94>- [</#8B8B94><#22D3EE>unbind</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>remove a binding"
  usage-rename: "<#8B8B94>- [</#8B8B94><#22D3EE>rename</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><old> <new> <#8B8B94>| <#D4D4D8>rename"
  usage-untrust: "<#8B8B94>- [</#8B8B94><#22D3EE>untrust</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><name> <#8B8B94>| <#D4D4D8>clear a session"
  usage-setspawn: "<#8B8B94>- [</#8B8B94><#22D3EE>setspawn</#22D3EE><#8B8B94>]</#8B8B94> <#8B8B94>| <#D4D4D8>set the held position"
  usage-status: "<#8B8B94>- [</#8B8B94><#22D3EE>status</#22D3EE><#8B8B94>]</#8B8B94> <#8B8B94>| <#D4D4D8>runtime state"
  usage-reload: "<#8B8B94>- [</#8B8B94><#22D3EE>reload</#22D3EE><#8B8B94>]</#8B8B94> <#8B8B94>| <#D4D4D8>reload config and messages"
  reloaded: "<#4ADE80>Config and message files reloaded"
  status: "<#8B8B94>Storage <#FFFFFF><dialect><newline><#8B8B94>Session <#FFFFFF><session><#D4D4D8> h<newline><#8B8B94>Locale <#FFFFFF><locale><newline><#8B8B94>Verifying <#FFFFFF><verifying><newline><#8B8B94>Mojang lookups <#FFFFFF><budget><newline><#8B8B94>Identity cache <#FFFFFF><cached>"
  unknown-name: "<#F87171>No record named <#FFFFFF><name>"
  unknown-player: "<#F87171><#FFFFFF><name></#FFFFFF> is not online"
  whois: "<#8B8B94>Name <#FFFFFF><name><newline><#8B8B94>UUID <#FFFFFF><uuid><newline><#8B8B94>Kind <#FFFFFF><kind><newline><#8B8B94>Subject <#FFFFFF><subject><newline><#8B8B94>Gamertag <#FFFFFF><gamertag>"
  session: "<#8B8B94>Player <#FFFFFF><name><newline><#8B8B94>From <#FFFFFF><address><newline><#8B8B94>Remaining <#FFFFFF><minutes><#D4D4D8> min"
  session-none: "<#D4D4D8><#FFFFFF><name></#FFFFFF> has no trusted session"
  not-verifying: "<#D4D4D8><#FFFFFF><name></#FFFFFF> is not verifying"
  verify-resent: "<#4ADE80>Sent a new code to <#FFFFFF><name>"
  setspawn-player-only: "<#F87171>Only a player can run this command"
  setspawn-done: "<#4ADE80>Verification position set to <#FFFFFF><world> <x> <y> <z>"
  unbound: "<#4ADE80>Removed the binding for <#FFFFFF><name>"
  untrusted: "<#4ADE80>Cleared the session for <#FFFFFF><name>"
  renamed: "<#4ADE80>Renamed <#FFFFFF><from></#FFFFFF> to <#FFFFFF><to>"
  rename-taken: "<#F87171><#FFFFFF><name></#FFFFFF> is held by <#FFFFFF><owner></#FFFFFF>"
  internal-error: "<#F87171>The operation failed; see the console"

# Disconnect reason handed to the proxy. Used when a player leaves the login server unverified.
proxy:
  unverified-departure: "Verification was not completed"

# Startup output. Read by the server owner, so it goes through the same locale files.
console:
  enabled: "<#4ADE80>Enabled</#4ADE80> <#8B8B94>·</#8B8B94> <#D4D4D8><storage>"
  pipeline-ok: "<#D4D4D8>Message rendering OK <#8B8B94>·</#8B8B94> <#D4D4D8><locale>"
  storage-migrated: "<#D4D4D8>Schema migrated to <#FFFFFF>v<version>"
  handshake-installed: "<#D4D4D8>Premium handshake installed"
  handshake-unavailable: "<#F87171>No channel hook available; the premium handshake cannot be installed</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>Premium players will not be able to join. A supported Paper version is required"
  floodgate-detected: "<#D4D4D8>Floodgate <#FFFFFF><version>"
  floodgate-broken: "<#FACC15>Floodgate API unavailable <#8B8B94>(<error>)</#8B8B94></#FACC15> <#D4D4D8>Bedrock players will verify normally"
  link-extension-installed: "<#D4D4D8>Wrote the Floodgate linking extension</#D4D4D8><newline><#8B8B94>Takes effect after a restart"
  link-extension-failed: "<#F87171>Could not write the Floodgate linking extension <#8B8B94>»</#8B8B94> <#D4D4D8><error>"
  link-extension-config: "<#FACC15>Floodgate config needs changes <#8B8B94>»</#8B8B94> <#D4D4D8><problem>"
  placeholderapi-ok: "<#D4D4D8>PlaceholderAPI expansion registered"
  placeholderapi-failed: "<#FACC15>PlaceholderAPI expansion failed to register <#8B8B94>»</#8B8B94> <#D4D4D8><error>"
  restriction-skipped: "<#8B8B94>No <name> event on this server; skipping that restriction"
  restriction-failed: "<#FACC15>Could not register the <name> listener <#8B8B94>»</#8B8B94> <#D4D4D8><error>"
  skins-restorer: "<#D4D4D8>SkinsRestorer handles skins"
  skins-self: "<#D4D4D8>This plugin handles skins <#8B8B94>·</#8B8B94> <#8B8B94>SkinsRestorer not detected"
  proxy-server-bypass: "<#FACC15>Proxy backend detected</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>Install this plugin on every backend; one without it can be reached with /server while unverified"
  proxy-not-detected: "<#FACC15>No proxy detected</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>safety.require-direct-connections is off but no proxy settings were found; check proxies.velocity.enabled in paper-global.yml. Working directory <cwd>"
  database-failed: "<#F87171>Could not open the database <#8B8B94>»</#8B8B94> <#D4D4D8><error>"

  # The four below need an operator, and are not ordinary startup lines.
  name-claimed: "<#FACC15><#FFFFFF><name></#FFFFFF> is now registered by a premium account, but was bound to a Microsoft player</#FACC15><newline><#D4D4D8>They have no Java Edition and cannot fix this themselves. Run <#FFFFFF>/kyokouauth rename <name> <new name>"
  refuse-proxy: "<#F87171>This server is behind a proxy; refusing to start</#F87171><newline><#D4D4D8>The proxy terminates the login handshake, so verification would silently fail<newline><#D4D4D8>Install the plugin on a standalone server, or set safety.require-direct-connections: false"
  refuse-version: "<#F87171>This server cannot set a player UUID; refusing to start</#F87171><newline><#D4D4D8>Current <#FFFFFF><server><newline><#D4D4D8>Paper 1.16 or newer is required"
  refuse-pipeline: "<#F87171>This server cannot render messages; refusing to start <#8B8B94>»</#8B8B94> <#D4D4D8><error>"
