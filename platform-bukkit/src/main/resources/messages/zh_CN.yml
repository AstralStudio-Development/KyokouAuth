# KyokouAuth 玩家消息
#
# 语法：<#RRGGBB> 为 hex 颜色，<red> 等为命名颜色，<newline> 为换行，
#       <click:open_url:'URL'>…</click> 为可点击段。
# 占位符用尖括号，运行时替换。未知标签按字面文本输出，写错不会导致消息发不出去。
#
# 色板
#   #22D3EE  品牌强调      #FFFFFF  正文
#   #D4D4D8  次要          #8B8B94  弱化
#   #4ADE80  成功          #FACC15  警告      #F87171  错误
#
# 结构：先陈述事实，再给下一步，中间用 » 分隔。消息末尾不加句号。

login:
  invalid-name: "<#F87171>用户名不合法</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>只允许 3-16 位字母、数字、下划线"
  name-taken: "<#F87171>这个名字不属于你的微软账户"
  premium-name: "<#F87171>这个名字属于正版账号</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>用官方启动器连接，已在用则重新连接"
  premium-name-claimed: "<#F87171>这个名字已被正版账号注册</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>联系管理员用 /kyokouauth rename 换名"
  identity-renamed: "<#FACC15>账户已改名</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>重新连接"
  directory-unavailable: "<#F87171>无法连接 Mojang</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  proxy: "<#F87171>本服无法完成登录握手</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>联系管理员"
  internal-error: "<#F87171>登录失败</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>联系管理员，控制台有原因"
  concurrent: "<#FACC15>该账户正在别处登录</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>另一处退出后重试"
  refused-by-plugin: "<#F87171>登录被其他插件拒绝"
  too-many-connections: "<#FACC15>连接过于频繁</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>等待一分钟后重试"

limbo:
  title: "<#22D3EE>请完成微软验证"
  subtitle: "<#D4D4D8>点击聊天栏中的链接"
  command-blocked: "<#FACC15>验证完成前不能使用命令</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>点击聊天栏中的链接完成验证"

handshake:
  not-authenticated: "<#F87171>客户端未通过正版验证</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>用官方启动器连接"
  session-unavailable: "<#F87171>无法连接 Mojang</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>稍后重试"
  failed: "<#F87171>登录握手失败</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>重新连接"
  directory-unavailable: "<#F87171>无法查询 Mojang 名字目录</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>稍后重试"

verification:
  prompt: "<#22D3EE>微软账户验证<newline><click:open_url:'<url>'><#FFFFFF><u><url></u></#FFFFFF></click><newline><#D4D4D8>或到 microsoft.com/link 输入 <#FFFFFF><code><newline><#8B8B94><minutes> 分钟内有效"
  start-failed: "<#F87171>无法启动微软登录</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>重新连接"
  expired: "<#FACC15>验证超时</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>重新连接"
  declined: "<#FACC15>已取消登录</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>重新连接"
  retry: "<#F87171>验证出错</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>重新连接"
  xbox-failed: "<#F87171>该微软账户不可用</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  name-mismatch: "<#FACC15>你的微软账户名字是 <#FFFFFF><proven></#FFFFFF></#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>用这个名字连接"
  refused: "<#F87171>无法绑定这个名字</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8><reason>"
  success: "<#4ADE80>验证成功</#4ADE80> <#8B8B94>»</#8B8B94> <#D4D4D8>欢迎回来，<#FFFFFF><name>"
  reconnect: "<#4ADE80>验证成功</#4ADE80> <#8B8B94>»</#8B8B94> <#D4D4D8>重新连接"

command:
  no-permission: "<#F87171>没有权限"
  unknown-subcommand: "<#F87171>未知子命令 <#FFFFFF><name></#FFFFFF></#F87171><newline><#D4D4D8>输入 /kyokouauth 查看全部"
  usage-header: "<#8B8B94>[</#8B8B94><#22D3EE>KyokouAuth</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8>命令"
  usage-whois: "<#8B8B94>- [</#8B8B94><#22D3EE>whois</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><名字> <#8B8B94>| <#D4D4D8>绑定详情"
  usage-session: "<#8B8B94>- [</#8B8B94><#22D3EE>session</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><名字> <#8B8B94>| <#D4D4D8>可信会话"
  usage-verify: "<#8B8B94>- [</#8B8B94><#22D3EE>verify</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><玩家> <#8B8B94>| <#D4D4D8>重发验证码"
  usage-unbind: "<#8B8B94>- [</#8B8B94><#22D3EE>unbind</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><名字> <#8B8B94>| <#D4D4D8>解除绑定"
  usage-rename: "<#8B8B94>- [</#8B8B94><#22D3EE>rename</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><旧> <新> <#8B8B94>| <#D4D4D8>改名"
  usage-untrust: "<#8B8B94>- [</#8B8B94><#22D3EE>untrust</#22D3EE><#8B8B94>]</#8B8B94> <#D4D4D8><名字> <#8B8B94>| <#D4D4D8>清除会话"
  usage-setspawn: "<#8B8B94>- [</#8B8B94><#22D3EE>setspawn</#22D3EE><#8B8B94>]</#8B8B94> <#8B8B94>| <#D4D4D8>设置验证位置"
  usage-status: "<#8B8B94>- [</#8B8B94><#22D3EE>status</#22D3EE><#8B8B94>]</#8B8B94> <#8B8B94>| <#D4D4D8>运行状态"
  usage-reload: "<#8B8B94>- [</#8B8B94><#22D3EE>reload</#22D3EE><#8B8B94>]</#8B8B94> <#8B8B94>| <#D4D4D8>重载配置"
  reloaded: "<#4ADE80>已重载配置与语言文件"
  status: "<#8B8B94>存储 <#FFFFFF><dialect><newline><#8B8B94>会话 <#FFFFFF><session><#D4D4D8> 小时<newline><#8B8B94>语言 <#FFFFFF><locale><newline><#8B8B94>验证中 <#FFFFFF><verifying><#D4D4D8> 人<newline><#8B8B94>Mojang 查询 <#FFFFFF><budget><newline><#8B8B94>身份缓存 <#FFFFFF><cached><#D4D4D8> 条"
  unknown-name: "<#F87171>没有名为 <#FFFFFF><name></#FFFFFF> 的记录"
  unknown-player: "<#F87171><#FFFFFF><name></#FFFFFF> 不在线"
  whois: "<#8B8B94>名字 <#FFFFFF><name><newline><#8B8B94>UUID <#FFFFFF><uuid><newline><#8B8B94>类型 <#FFFFFF><kind><newline><#8B8B94>标识 <#FFFFFF><subject><newline><#8B8B94>玩家代号 <#FFFFFF><gamertag>"
  session: "<#8B8B94>玩家 <#FFFFFF><name><newline><#8B8B94>来源 <#FFFFFF><address><newline><#8B8B94>剩余 <#FFFFFF><minutes><#D4D4D8> 分钟"
  session-none: "<#D4D4D8><#FFFFFF><name></#FFFFFF> 没有可信会话"
  not-verifying: "<#D4D4D8><#FFFFFF><name></#FFFFFF> 不在验证中"
  verify-resent: "<#4ADE80>已为 <#FFFFFF><name></#FFFFFF> 重新发送验证码"
  setspawn-player-only: "<#F87171>只有玩家可以执行这条命令"
  setspawn-done: "<#4ADE80>验证位置已设为 <#FFFFFF><world> <x> <y> <z>"
  unbound: "<#4ADE80>已解除 <#FFFFFF><name></#FFFFFF> 的绑定"
  untrusted: "<#4ADE80>已清除 <#FFFFFF><name></#FFFFFF> 的会话"
  renamed: "<#4ADE80>已把 <#FFFFFF><from></#FFFFFF> 改名为 <#FFFFFF><to>"
  rename-taken: "<#F87171><#FFFFFF><name></#FFFFFF> 已被 <#FFFFFF><owner></#FFFFFF> 占用"
  internal-error: "<#F87171>操作失败，查看控制台"

# 发给代理的断开原因。玩家未完成验证就离开登录服时使用。
proxy:
  unverified-departure: "验证未完成，连接已断开"

# 启动日志。这些是给服务器主人看的，所以同样走语言文件。
console:
  enabled: "<#4ADE80>已启用</#4ADE80> <#8B8B94>·</#8B8B94> <#D4D4D8><storage>"
  pipeline-ok: "<#D4D4D8>消息渲染正常 <#8B8B94>·</#8B8B94> <#D4D4D8><locale>"
  storage-migrated: "<#D4D4D8>数据库升级到 <#FFFFFF>v<version>"
  handshake-installed: "<#D4D4D8>正版握手已装载"
  handshake-unavailable: "<#F87171>没有可用的通道钩子，正版握手无法装载</#F87171> <#8B8B94>»</#8B8B94> <#D4D4D8>正版玩家将无法进服，需要受支持的 Paper 版本"
  floodgate-detected: "<#D4D4D8>Floodgate <#FFFFFF><version>"
  floodgate-broken: "<#FACC15>Floodgate API 不可用 <#8B8B94>(<error>)</#8B8B94></#FACC15> <#D4D4D8>基岩玩家将走常规验证"
  link-extension-installed: "<#D4D4D8>已写入 Floodgate 关联扩展</#D4D4D8><newline><#8B8B94>重启后生效"
  link-extension-failed: "<#F87171>无法写入 Floodgate 关联扩展 <#8B8B94>»</#8B8B94> <#D4D4D8><error>"
  link-extension-config: "<#FACC15>Floodgate 配置需修改 <#8B8B94>»</#8B8B94> <#D4D4D8><problem>"
  placeholderapi-ok: "<#D4D4D8>PlaceholderAPI 变量已注册"
  placeholderapi-failed: "<#FACC15>PlaceholderAPI 变量注册失败 <#8B8B94>»</#8B8B94> <#D4D4D8><error>"
  restriction-skipped: "<#8B8B94>本服务端无 <name> 事件，跳过该项限制"
  restriction-failed: "<#FACC15>无法注册 <name> 监听器 <#8B8B94>»</#8B8B94> <#D4D4D8><error>"
  skins-restorer: "<#D4D4D8>SkinsRestorer 接管皮肤"
  skins-self: "<#D4D4D8>本插件接管皮肤 <#8B8B94>·</#8B8B94> <#8B8B94>未检测到 SkinsRestorer"
  proxy-server-bypass: "<#FACC15>检测到代理后端</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>请在每个子服都安装本插件；漏装的子服可被未验证玩家用 /server 进入"
  proxy-not-detected: "<#FACC15>未检测到代理</#FACC15> <#8B8B94>»</#8B8B94> <#D4D4D8>safety.require-direct-connections 已关闭，但没找到代理配置；检查 paper-global.yml 的 proxies.velocity.enabled。工作目录 <cwd>"
  database-failed: "<#F87171>无法打开数据库 <#8B8B94>»</#8B8B94> <#D4D4D8><error>"

  # 以下四条需要运维介入，不是普通启动日志。
  name-claimed: "<#FACC15><#FFFFFF><name></#FFFFFF> 已被正版账号注册，但原本绑定给一位微软玩家</#FACC15><newline><#D4D4D8>他没有 Java 版，无法自行解决，请执行 <#FFFFFF>/kyokouauth rename <name> <新名字>"
  refuse-proxy: "<#F87171>服务器处于代理后端，拒绝启动</#F87171><newline><#D4D4D8>代理接管登录握手，本服看不到，认证会静默失效<newline><#D4D4D8>把插件装在独立服务器上，或设置 safety.require-direct-connections: false"
  refuse-version: "<#F87171>服务端无法指定玩家 UUID，拒绝启动</#F87171><newline><#D4D4D8>当前 <#FFFFFF><server><newline><#D4D4D8>需要 Paper 1.16 或更新版本"
  refuse-pipeline: "<#F87171>服务端无法渲染消息，拒绝启动 <#8B8B94>»</#8B8B94> <#D4D4D8><error>"
