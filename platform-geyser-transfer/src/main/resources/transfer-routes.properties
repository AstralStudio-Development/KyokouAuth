# Optional Geyser 2.12.1-b1303 extension. Install this small jar in Geyser's extensions directory.
# Restart Geyser, edit this extension's generated transfer-routes.properties, then restart again.
# Enable only after replacing BOTH destinations with explicit administrator-controlled addresses.
# java-host/port must match the proxy's configured Java transfer destination exactly (DNS case ignored).
# bedrock-host/port must be reachable by the Bedrock CLIENT, not the Java backend or Geyser bind address.
# DNS/IPv4 only. No wildcard, URI, SRV lookup or client-provided hostname. Max 64 routes / 16KiB.
# This only improves reconnect UX: a new channel must obtain fresh Floodgate proof and recheck roles.
# No XUID authorization, authentication override, key access or cookie copying occurs in this extension.
# A real reconnect/loading screen remains; unsupported clients must reconnect manually.
enabled=false

# route.local.java-host=proxy.example.com
# route.local.java-port=25565
# route.local.bedrock-host=bedrock.example.com
# route.local.bedrock-port=19132
