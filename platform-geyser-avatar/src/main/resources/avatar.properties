# Optional Geyser 2.12.1-b1303 inventory avatar presentation, separate from the transfer-only extension.
# Install KyokouAuth-GeyserAvatar in Geyser's extensions directory and restart once to create this file.
# Enable only when the paired proxy presentation bridge is enabled at the exact loopback endpoint.
# Xbox login validation and Floodgate authentication MUST remain enabled; this module grants nothing.
enabled=false
proxy-endpoint=http://127.0.0.1:24682/v1/avatars
status-host=127.0.0.1
status-port=24683
snapshot-timeout-ms=200
# Including the immutable generic base. Every pack <=32768B; max64 means total <=2MiB.
max-packs=64
max-sessions=1024
# One presentation worker / queue16, no redirects, no external image downloads.
# 202/MISS, invalid/late response or saturated cache offers two explicit generic question-mark icons.
# offered/fingerprint/nonce are NOT client rendering/download acknowledgements or authentication.
# Current client references pin files. Saturated session tracking conservatively pins the generic base
# until Geyser process exit; no active package is overwritten or removed for a reload.
# Java PROFILE and ordinary player heads remain untouched; only CMD 0x4B5901 / 0x4B5902 are translated.
